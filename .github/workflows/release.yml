name: Release
on:
  push:
    tags: ['v*']

# Publishes @corthos/corthography-{sdk,cli} via npm trusted publishing (OIDC):
# GitHub Actions proves its identity to npm, so there is no long-lived npm token
# to expire (NPM_TOKEN silently broke the v0.1.7 and v0.1.8 publishes, #35).
# Requires, once per package on npmjs.com: Settings → Trusted Publisher →
# GitHub Actions → corthosai / client.corthography.ai / release.yml.
# Provenance attestations are generated automatically.

jobs:
  publish:
    runs-on: ubuntu-latest # trusted publishing does not support self-hosted runners
    permissions:
      contents: read
      id-token: write # required: lets the job mint the OIDC token npm verifies
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '24' # trusted publishing needs Node >= 22.14 and npm >= 11.5.1
          registry-url: 'https://registry.npmjs.org'
          package-manager-cache: false # no dependency caching in release builds (npm guidance)
      - name: Check npm supports trusted publishing
        run: |
          v="$(npm --version)"
          echo "npm $v"
          if [ "$(printf '%s\n' 11.5.1 "$v" | sort -V | head -n1)" != "11.5.1" ]; then
            echo "::error::npm $v is older than 11.5.1, which trusted publishing requires"
            exit 1
          fi
      - run: npm ci
      - run: npm run build
      - run: npm test
      # npm silently "auto-corrects" an invalid package.json at publish time — npm 11
      # dropped the CLI's `bin` this way, which would ship a CLI with no command.
      # Fail instead of publishing a manifest that differs from the repo's.
      - name: Check npm will publish package.json unmodified
        run: |
          for ws in @corthos/corthography-sdk @corthos/corthography-cli; do
            out="$(npm publish --dry-run --workspace "$ws" 2>&1)" || { echo "$out"; exit 1; }
            if printf '%s' "$out" | grep -q "auto-corrected"; then
              printf '%s\n' "$out" | grep -A5 "auto-corrected"
              echo "::error::npm would rewrite $ws's package.json at publish — run 'npm pkg fix' in that workspace"
              exit 1
            fi
          done
      # SDK first: the CLI depends on the exact same @corthos/corthography-sdk version.
      # Each publish is skipped when that version is already on npm, so a release that
      # failed part-way (e.g. SDK published, CLI rejected) can simply be re-run.
      - name: Publish @corthos/corthography-sdk
        run: |
          v="$(node -p "require('./sdk/js/package.json').version")"
          if npm view "@corthos/corthography-sdk@$v" version >/dev/null 2>&1; then
            echo "@corthos/corthography-sdk@$v is already on npm; skipping"
          else
            npm publish --workspace @corthos/corthography-sdk --access public
          fi
      - name: Publish @corthos/corthography-cli
        run: |
          v="$(node -p "require('./cli/package.json').version")"
          if npm view "@corthos/corthography-cli@$v" version >/dev/null 2>&1; then
            echo "@corthos/corthography-cli@$v is already on npm; skipping"
          else
            npm publish --workspace @corthos/corthography-cli --access public
          fi
